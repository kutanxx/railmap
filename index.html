<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레일맵</title>
    <meta name="description" content="실제 도시 지도 위에 역을 놓고 선로를 깔면 열차가 달려요. 서울·부산·도쿄·런던 등 11개 지도, 설치 없이 브라우저에서 하는 철도 건설 게임." />
    <!-- 링크 미리보기 (카카오톡·디스코드·X 등에 주소를 붙이면 나오는 카드). 그림은 public/og-image.png (1200×630).
         그림 주소는 웹 데모 주소 그대로 적어야 한다 (미리보기는 상대 주소를 읽지 못한다). 데모 주소가 바뀌면 함께 바꾼다 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="레일맵" />
    <meta property="og:title" content="레일맵 · 지도 위에 지하철을 짓는 게임" />
    <meta property="og:description" content="실제 도시 지도 위에 역을 놓고 선로를 깔면 열차가 달려요. 서울·부산·도쿄·런던 등 11개 지도, 설치 없이 브라우저에서." />
    <meta property="og:url" content="https://kutanxx.github.io/railmap/" />
    <meta property="og:image" content="https://kutanxx.github.io/railmap/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="서울 지도 위에 지은 지하철 노선과 레일맵 제목" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="map"></div>
    <div class="top-left">
      <div class="top-row">
        <button id="badge" class="badge" type="button" title="눌러서 멈춤 · 다시 가기 (Space 키)"></button>
        <div id="speed" class="speed"></div>
        <div id="status" class="status"></div>
      </div>
      <div class="top-row">
        <div id="toolbar" class="toolbar"></div>
        <div class="hud-group">
          <span class="pop-anchor">
            <button id="goals-button" class="hud-button" type="button" aria-expanded="false" title="게임 목표">목표</button>
            <div id="goals-list" class="popover popover-down goals-list" hidden></div>
          </span>
          <span class="pop-anchor">
            <button id="stats-button" class="hud-button" type="button" aria-expanded="false" title="통계: 자금·월 수지·하루 승객 그래프">통계</button>
            <div id="stats-panel" class="popover popover-down stats-panel" hidden></div>
          </span>
          <span class="pop-anchor">
            <button id="notice-button" class="hud-button" type="button" aria-expanded="false" title="지난 알림">알림</button>
            <div id="notice-log" class="popover popover-down notice-log" hidden></div>
          </span>
        </div>
      </div>
    </div>
    <div class="bottom-left">
      <div class="hud-group">
        <button id="undo-button" class="hud-button" type="button" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
        <button id="redo-button" class="hud-button" type="button" title="다시 하기 (Ctrl+Y)" aria-label="다시 하기">↷</button>
      </div>
      <div class="hud-group">
        <div id="congestion" class="view-toggle"></div>
        <div id="terrain" class="view-toggle" hidden></div>
        <div class="view-toggle">
          <button id="diagram-button" class="hud-button" type="button" title="노선도 보기: 내 노선망을 지하철 노선도처럼 (D 키)">노선도<span class="tool-key">D</span></button>
        </div>
        <div class="view-toggle">
          <button id="control-room-button" class="hud-button" type="button" title="관제실 모드: 어두운 지도 (N 키)">관제실<span class="tool-key">N</span></button>
        </div>
      </div>
      <div class="hud-group">
        <span class="pop-anchor">
          <button id="menu-button" class="hud-button" type="button" aria-expanded="false" title="내보내기 · 불러오기 · 새로 시작 · 지도 바꾸기">메뉴 ▴</button>
          <div id="file-menu" class="popover" hidden></div>
        </span>
        <span class="pop-anchor">
          <button id="sound-open" class="hud-button" type="button" aria-expanded="false" title="소리 켜고 끄기 (M 키) · 크기 · 음악">소리 ▴</button>
          <div class="popover sound-panel" hidden>
            <button id="sound-button" class="hud-button" type="button" title="소리 켜고 끄기 (M 키)"></button>
            <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" step="5" aria-label="소리 크기" title="소리 크기" />
            <button id="music-button" class="hud-button" type="button" title="배경 음악 켜고 끄기"></button>
          </div>
        </span>
        <button id="help-button" class="hud-button" type="button" title="조작 안내">?</button>
      </div>
    </div>
    <div class="side">
      <aside id="panel" class="panel"></aside>
      <aside id="routes" class="panel"></aside>
    </div>
    <div id="route-strip" class="route-strip" hidden></div>
    <div id="cursor-tip" class="cursor-tip"></div>
    <div id="profile" class="profile-panel" hidden></div>
    <div id="bankrupt" class="dialog-backdrop" hidden></div>
    <div id="help" class="dialog-backdrop" hidden></div>
    <div id="tutorial" class="tutorial" hidden></div>
    <div id="start" class="start-screen" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
