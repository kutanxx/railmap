<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레일맵</title>
  </head>
  <body>
    <div id="map"></div>
    <div class="top-left">
      <div class="top-row">
        <div id="badge" class="badge"></div>
        <div id="status" class="status"></div>
      </div>
      <div class="top-row">
        <div id="toolbar" class="toolbar"></div>
        <div id="speed" class="speed"></div>
        <div id="congestion" class="congestion"></div>
        <div id="terrain" class="congestion" hidden></div>
        <div class="congestion sound-box">
          <button id="sound-button" class="congestion-button" type="button" title="소리 켜고 끄기 (M 키)"></button>
          <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" step="5" aria-label="소리 크기" title="소리 크기" />
        </div>
        <button id="help-button" class="help-button" type="button" title="조작 안내">?</button>
      </div>
    </div>
    <div class="side">
      <aside id="panel" class="panel"></aside>
      <aside id="routes" class="panel"></aside>
    </div>
    <div id="file-menu" class="file-menu"></div>
    <div id="cursor-tip" class="cursor-tip"></div>
    <div id="profile" class="profile-panel" hidden></div>
    <div id="bankrupt" class="dialog-backdrop" hidden></div>
    <div id="help" class="dialog-backdrop" hidden></div>
    <div id="tutorial" class="tutorial" hidden></div>
    <div id="start" class="start-screen" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
