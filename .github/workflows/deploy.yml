# GitHub Pages에 웹 데모를 올린다 (docs/deploy.md의 "방법 2").
# GitHub에 올린 저장소의 main 브랜치에 새 커밋이 올라가면 저절로 npm run build를 하고 dist/를 올린다.
# GitHub를 쓰지 않으면 이 파일은 아무 일도 하지 않는다.
name: 웹 데모 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
