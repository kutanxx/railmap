<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 C · 역 안내판</title>
<link rel="stylesheet" href="brand.css" />
<style>
  .band { background: var(--color-ink); color: var(--color-on-ink); border-bottom: 8px solid var(--color-accent); }
  .band-in { max-width: 1200px; margin: 0 auto; padding: 40px 40px 36px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .mark { display: flex; align-items: center; gap: 20px; }
  .roundel { width: 72px; height: 72px; border-radius: 50%; border: 10px solid var(--color-accent); background: var(--color-ink); }
  .title { margin: 0; font-size: 72px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .lede { margin: 6px 0 0; font-size: 18px; color: var(--color-on-ink-soft); }
  .go { min-height: 56px; padding: 0 28px; border: 0; border-radius: 6px; background: var(--color-accent); color: var(--color-ink); font-size: 19px; font-weight: 800; }
  .go:hover { background: var(--color-paper); }
  .go-note { margin: 8px 0 0; font-size: 14px; color: var(--color-on-ink-soft); text-align: right; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 40px 64px; }
  .tabs { display: flex; border: 2px solid var(--color-ink); border-radius: 6px; overflow: hidden; width: max-content; }
  .tabs button { min-height: 44px; padding: 0 22px; border: 0; border-right: 2px solid var(--color-ink); background: var(--color-paper); font-weight: 800; font-size: 16px; }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected='true'] { background: var(--color-ink); color: var(--color-on-ink); }

  .board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 24px; }
  .sign { border: 2px solid var(--color-ink); border-radius: 6px; background: var(--color-paper); overflow: hidden; }
  .sign-name { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 20px; background: var(--color-ink); color: var(--color-on-ink); }
  .sign-name h2 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
  .sign-name span { font-size: 14px; color: var(--color-on-ink-soft); }
  .sign-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 20px; padding: 20px; }
  .sign-body img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 2px solid var(--color-ink); border-radius: 4px; }
  .sign-body p { margin: 0 0 14px; font-size: 16px; color: var(--color-muted); }
  .acts { display: grid; gap: 8px; }
  .btn { min-height: 44px; padding: 0 14px; border: 2px solid var(--color-ink); border-radius: 6px; background: var(--color-paper); font-weight: 800; font-size: 15px; text-align: left; }
  .btn.primary { background: var(--color-ink); color: var(--color-on-ink); }
  .btn:hover { background: var(--color-land); }
  .btn.primary:hover { background: var(--color-ink-hover); }
  .platforms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; font-size: 13px; color: var(--color-muted); }
  .platforms button { min-width: 52px; min-height: 32px; border: 0; border-radius: 4px; background: var(--color-accent); color: var(--color-ink); font-weight: 800; font-size: 15px; }
  .credit { margin-top: 40px; font-size: 13px; color: var(--color-muted); }
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div class="mark">
      <span class="roundel" aria-hidden="true"></span>
      <div>
        <h1 class="title">레일맵</h1>
        <p class="lede">역을 놓고 선로를 깔면 열차가 달려요</p>
      </div>
    </div>
    <div>
      <button class="go" type="button">서울에서 바로 시작 ▶</button>
      <p class="go-note">처음 몇 걸음은 튜토리얼이 알려줘요</p>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true">한국 도시 6</button>
    <button role="tab">세계 도시 6</button>
    <button role="tab">가상 지도 1</button>
  </div>
  <section class="board">
    <article class="sign">
      <div class="sign-name"><h2>서울</h2><span>실제 지도 · 한국</span></div>
      <div class="sign-body"><img src="/thumbnails/seoul.svg" alt="" />
        <div><p>한강을 건너는 수도, 도심에서 분당까지</p>
          <div class="acts"><button class="btn primary">새 게임</button><button class="btn">샌드박스 (돈 무제한)</button><button class="btn">실제 노선망으로 시작</button></div>
          <div class="platforms">그해의 노선망 <button>1974</button><button>1985</button><button>1996</button><button>2005</button><button>2015</button></div></div>
      </div>
    </article>
    <article class="sign">
      <div class="sign-name"><h2>부산</h2><span>실제 지도 · 한국</span></div>
      <div class="sign-body"><img src="/thumbnails/busan.svg" alt="" />
        <div><p>바다와 산 사이로 길게 뻗은 항구 도시</p>
          <div class="acts"><button class="btn primary">새 게임</button><button class="btn">샌드박스 (돈 무제한)</button><button class="btn">실제 노선망으로 시작</button></div>
          <div class="platforms">그해의 노선망 <button>1985</button><button>1994</button><button>2005</button><button>2011</button><button>2017</button></div></div>
      </div>
    </article>
  </section>
  <p class="credit">지도 그림·실제 노선 자료 © OpenStreetMap 기여자, OpenFreeMap. 개통 연도: 서울교통공사, 일본 국토교통성 국토수치정보 가공, Wikidata</p>
</div>
</body>
</html>
